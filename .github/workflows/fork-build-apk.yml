# Travel/hiking 改造：fork 专用 APK 自动构建流水线。
#
# 设计目标：
# 1. 任何 push / PR / 手动触发都自动产出 debug APK 作为 workflow artifact，便于自测；
# 2. 推 tag（如 v135-travel.1）时额外打 release APK；
#    - 若 fork 用户在 GitHub Secrets 配了签名密钥，release APK 会被签名；
#    - 否则同样产出未签名 release APK 作为 artifact（不创建 Release）；
# 3. 完全不依赖上游 mendhak/gpslogger 的私有 secrets（PGP/Cosign），
#    fork 任何人都能直接跑通。
#
# 触发条件之间的关系：
# - push（除 tag 外）         -> 构建 debug APK
# - pull_request               -> 构建 debug APK
# - push tag v*                -> 构建 debug + release APK + 创建 GitHub Release
# - workflow_dispatch          -> 由用户参数决定是否同时构建 release

name: Fork Build APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_release:
        description: '同时构建 release APK（需要 keystore secrets，否则会出 unsigned 包）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # 任何分支/PR 都跑：构建 debug APK 作为 artifact。
  # 不需要任何 secrets，fork 立即可用。
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Gradle 缓存可让二次构建从 ~5 分钟降到 1 分钟内。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Print versions
        run: |
          ./gradlew --version
          java -version

      - name: Assemble debug APK
        run: ./gradlew :gpslogger:assembleDebug --no-daemon --stacktrace

      - name: Locate debug APK
        id: locate_debug
        run: |
          set -euxo pipefail
          APK_PATH=$(find gpslogger/build/outputs/apk/debug -maxdepth 2 -name "*.apk" -print -quit)
          test -n "$APK_PATH"
          BASENAME=$(basename "$APK_PATH")
          # 命名：gpslogger-travel-debug-<versionName>-<short_sha>.apk
          VERSION=$(grep -E "versionName\s+\"?[0-9A-Za-z._-]+\"?" gpslogger/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TARGET="gpslogger-travel-debug-${VERSION}-${SHORT_SHA}.apk"
          cp "$APK_PATH" "$TARGET"
          echo "apk_path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "apk_basename=$BASENAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpslogger-travel-debug-${{ steps.locate_debug.outputs.version }}-${{ github.run_number }}
          path: ${{ steps.locate_debug.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

  # 只在 tag 或手动触发且选了 release 时跑。
  # 没有签名 secrets 也能跑，只是 release APK 不带签名（Android 装机仍会拒绝，
  # 用户应用作 CI 产物或测试包）。
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: build-debug
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_release == 'true')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 仅在 fork 用户在 GitHub Secrets 里同时配了
      #   KEYSTORE_BASE64 / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD / SIGNING_STORE_PASSWORD
      # 时才解码 keystore；否则编译走 unsigned release。
      - name: Decode keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ] \
             && [ -n "${SIGNING_KEY_ALIAS:-}" ] \
             && [ -n "${SIGNING_KEY_PASSWORD:-}" ] \
             && [ -n "${SIGNING_STORE_PASSWORD:-}" ]; then
            mkdir -p gpslogger/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > gpslogger/keystore/your_signing_keystore.jks
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing or incomplete. Building unsigned release APK."
          fi

      # 关键点：只有在签名 secrets 完整时才把 SIGNING_* 注入子进程，
      # 否则 build.gradle 第 99 行会因 SIGNING_STORE_PASSWORD 非空进入「读 keystore 文件」分支但文件不存在。
      - name: Assemble release APK (signed)
        if: steps.keystore.outputs.have_keystore == 'true'
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew :gpslogger:assembleRelease --no-daemon --stacktrace

      - name: Assemble release APK (unsigned)
        if: steps.keystore.outputs.have_keystore != 'true'
        run: ./gradlew :gpslogger:assembleRelease --no-daemon --stacktrace

      - name: Locate release APK
        id: locate_release
        run: |
          set -euxo pipefail
          # 优先 signed/aligned 输出；否则取 unsigned。
          APK_PATH=$(find gpslogger/build/outputs/apk/release -maxdepth 2 -name "*.apk" -print | head -1)
          test -n "$APK_PATH"
          VERSION=$(grep -E "versionName\s+\"?[0-9A-Za-z._-]+\"?" gpslogger/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          TAG_NAME="${GITHUB_REF##*/}"
          if [ "${{ steps.keystore.outputs.have_keystore }}" = "true" ]; then
            SUFFIX=""
          else
            SUFFIX="-unsigned"
          fi
          TARGET="gpslogger-travel-release-${VERSION}-${TAG_NAME}${SUFFIX}.apk"
          cp "$APK_PATH" "$TARGET"
          ( cd "$(dirname "$TARGET")" && sha256sum "$(basename "$TARGET")" > "$(basename "$TARGET").SHA256" )
          echo "apk_path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "sha_path=$TARGET.SHA256" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpslogger-travel-release-${{ steps.locate_release.outputs.version }}-${{ steps.locate_release.outputs.tag }}
          path: |
            ${{ steps.locate_release.outputs.apk_path }}
            ${{ steps.locate_release.outputs.sha_path }}
          if-no-files-found: error
          retention-days: 90

      # 只有 tag 触发才发 Release。手动触发不发，避免重复。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.locate_release.outputs.tag }}
          name: ${{ steps.locate_release.outputs.tag }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          fail_on_unmatched_files: true
          body: |
            自动构建产物。

            版本号（versionName）：`${{ steps.locate_release.outputs.version }}`
            签名状态：`${{ steps.keystore.outputs.have_keystore == 'true' && 'signed' || 'unsigned (CI artifact only)' }}`

            校验：
            ```
            sha256sum -c ${{ steps.locate_release.outputs.tag }}/*.SHA256
            ```
          files: |
            ${{ steps.locate_release.outputs.apk_path }}
            ${{ steps.locate_release.outputs.sha_path }}
