# Travel/hiking 改造：fork 专用 APK 自动构建流水线。
#
# 设计目标：
# 1. 任何 push / PR / 手动触发都自动产出 debug APK 作为 workflow artifact，便于自测；
# 2. 推 tag（如 v135-travel.1）时额外打 release APK；
#    - 若 fork 用户在 GitHub Secrets 配了签名密钥，release APK 会被签名；
#    - 否则同样产出未签名 release APK 作为 artifact（不创建 Release）；
# 3. 完全不依赖上游 mendhak/gpslogger 的私有 secrets（PGP/Cosign），
#    fork 任何人都能直接跑通。
#
# 历史问题修正：
# - 旧版用 gradle/actions/setup-gradle@v3 做依赖缓存，post-cleanup 会拉一个独立的
#   Gradle 9.5.1 跑清理 init.gradle 脚本，触发
#     "Cannot get the value of write-only property 'removeUnusedEntriesOlderThan'"
#   导致 build-debug job 被标记 failed，进而 build-release 因 needs:build-debug
#   未执行，Release 没有 APK。
#   修正：改用 actions/setup-java@v4 内置的 gradle 缓存（无 post-cleanup 副作用），
#   并解开 build-release 对 build-debug 的依赖。
#
# 触发条件之间的关系：
# - push 到非 master 分支             -> 仅构建 debug APK（artifact）
# - pull_request                       -> 仅构建 debug APK（artifact）
# - push 到 master                     -> debug + release APK，并刷新固定的 `nightly` 预发布 Release
# - push tag v*                        -> debug + release APK，创建正式 GitHub Release
# - workflow_dispatch + build_release  -> debug + release APK 作为 artifact，不创建 Release

name: Fork Build APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_release:
        description: '同时构建 release APK（需要 keystore secrets，否则会出 unsigned 包）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # 任何分支/PR 都跑：构建 debug APK 作为 artifact。
  # 不需要任何 secrets，fork 立即可用。
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17 (with gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # actions/setup-java 自带 gradle 缓存，零 post-cleanup 副作用。
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Print versions
        run: |
          ./gradlew --version
          java -version

      - name: Assemble debug APK
        run: ./gradlew :gpslogger:assembleDebug --no-daemon --stacktrace

      - name: Locate debug APK
        id: locate_debug
        run: |
          set -euxo pipefail
          APK_PATH=$(find gpslogger/build/outputs/apk/debug -maxdepth 2 -name "*.apk" -print -quit)
          test -n "$APK_PATH"
          BASENAME=$(basename "$APK_PATH")
          # 命名：gpslogger-travel-debug-<versionName>-<short_sha>.apk
          VERSION=$(grep -E "versionName\s+\"?[0-9A-Za-z._-]+\"?" gpslogger/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TARGET="gpslogger-travel-debug-${VERSION}-${SHORT_SHA}.apk"
          cp "$APK_PATH" "$TARGET"
          echo "apk_path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "apk_basename=$BASENAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpslogger-travel-debug-${{ steps.locate_debug.outputs.version }}-${{ github.run_number }}
          path: ${{ steps.locate_debug.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

  # 三种触发：tag、master push、手动触发选了 release。
  # 与 build-debug 独立（不再 needs），避免 debug 任何步骤失败连带导致 release 不跑、Release 无 APK。
  # 没有签名 secrets 也能跑，只是 release APK 不带签名（Android 装机仍会拒绝，
  # 用户应用作 CI 产物或测试包）。
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_release == 'true')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17 (with gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 仅在 fork 用户在 GitHub Secrets 里同时配了
      #   KEYSTORE_BASE64 / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD / SIGNING_STORE_PASSWORD
      # 时才解码 keystore；否则编译走 unsigned release。
      - name: Decode keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ] \
             && [ -n "${SIGNING_KEY_ALIAS:-}" ] \
             && [ -n "${SIGNING_KEY_PASSWORD:-}" ] \
             && [ -n "${SIGNING_STORE_PASSWORD:-}" ]; then
            mkdir -p gpslogger/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > gpslogger/keystore/your_signing_keystore.jks
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing or incomplete. Building unsigned release APK."
          fi

      # 关键点：只有在签名 secrets 完整时才把 SIGNING_* 注入子进程，
      # 否则 build.gradle 第 99 行会因 SIGNING_STORE_PASSWORD 非空进入「读 keystore 文件」分支但文件不存在。
      - name: Assemble release APK (signed)
        if: steps.keystore.outputs.have_keystore == 'true'
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew :gpslogger:assembleRelease --no-daemon --stacktrace

      - name: Assemble release APK (unsigned)
        if: steps.keystore.outputs.have_keystore != 'true'
        run: ./gradlew :gpslogger:assembleRelease --no-daemon --stacktrace

      - name: Locate release APK
        id: locate_release
        run: |
          set -euxo pipefail
          # 优先 signed/aligned 输出；否则取 unsigned。
          APK_PATH=$(find gpslogger/build/outputs/apk/release -maxdepth 2 -name "*.apk" -print | head -1)
          test -n "$APK_PATH"
          VERSION=$(grep -E "versionName\s+\"?[0-9A-Za-z._-]+\"?" gpslogger/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          # 区分发布模式：tag / nightly / dispatch
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            MODE="tag"
            LABEL="${GITHUB_REF##*/}"
            RELEASE_TAG="$LABEL"
            RELEASE_NAME="$LABEL"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/master" ]]; then
            MODE="nightly"
            LABEL="nightly-${SHORT_SHA}"
            RELEASE_TAG="nightly"
            RELEASE_NAME="Nightly Build"
          else
            MODE="dispatch"
            LABEL="manual-${SHORT_SHA}"
            RELEASE_TAG=""
            RELEASE_NAME=""
          fi
          if [ "${{ steps.keystore.outputs.have_keystore }}" = "true" ]; then
            SUFFIX=""
          else
            SUFFIX="-unsigned"
          fi
          TARGET="gpslogger-travel-release-${VERSION}-${LABEL}${SUFFIX}.apk"
          cp "$APK_PATH" "$TARGET"
          ( cd "$(dirname "$TARGET")" && sha256sum "$(basename "$TARGET")" > "$(basename "$TARGET").SHA256" )
          echo "apk_path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "sha_path=$TARGET.SHA256" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpslogger-travel-release-${{ steps.locate_release.outputs.version }}-${{ steps.locate_release.outputs.label }}
          path: |
            ${{ steps.locate_release.outputs.apk_path }}
            ${{ steps.locate_release.outputs.sha_path }}
          if-no-files-found: error
          retention-days: 90

      # master push 刷新固定 nightly tag，确保 nightly Release 指向最新提交。
      - name: Move nightly tag
        if: steps.locate_release.outputs.mode == 'nightly'
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly

      # tag 触发发正式 Release；master push 刷新固定 nightly 预发布 Release。手动触发不发，避免重复。
      - name: Create GitHub Release
        if: steps.locate_release.outputs.mode == 'tag' || steps.locate_release.outputs.mode == 'nightly'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.locate_release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.locate_release.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.locate_release.outputs.mode == 'nightly' || contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          make_latest: ${{ steps.locate_release.outputs.mode == 'tag' }}
          fail_on_unmatched_files: true
          body: |
            自动构建产物。

            版本号（versionName）：`${{ steps.locate_release.outputs.version }}`
            构建来源：`${{ steps.locate_release.outputs.label }}`
            签名状态：`${{ steps.keystore.outputs.have_keystore == 'true' && 'signed' || 'unsigned (CI artifact only)' }}`

            校验：
            ```
            sha256sum -c *.SHA256
            ```
          files: |
            ${{ steps.locate_release.outputs.apk_path }}
            ${{ steps.locate_release.outputs.sha_path }}
