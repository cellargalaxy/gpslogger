# Travel/hiking 改造：fork 专用 APK 自动构建流水线。
#
# 设计目标：
# 1. 任何 push / PR / 手动触发都自动产出 debug APK 作为 workflow artifact，便于自测；
# 2. 任意分支 push 都额外打一个可安装 APK，并创建独立 GitHub Release；
# 3. 推 tag（如 v135-travel.1）时额外打 release APK；
#    - 若 fork 用户在 GitHub Secrets 配了签名密钥，release APK 会被签名；
#    - 否则产出 debug-signed APK，Android 可直接安装，但不能当正式 release 包；
# 4. 完全不依赖上游 mendhak/gpslogger 的私有 secrets（PGP/Cosign），
#    fork 任何人都能直接跑通。
#
# 历史问题修正：
# - 旧版用 gradle/actions/setup-gradle@v3 做依赖缓存，post-cleanup 会拉一个独立的
#   Gradle 9.5.1 跑清理 init.gradle 脚本，触发
#     "Cannot get the value of write-only property 'removeUnusedEntriesOlderThan'"
#   导致 build-debug job 被标记 failed，进而 build-release 因 needs:build-debug
#   未执行，Release 没有 APK。
#   修正：改用 actions/setup-java@v4 内置的 gradle 缓存（无 post-cleanup 副作用），
#   并解开 build-release 对 build-debug 的依赖。
#
# 触发条件之间的关系：
# - 任意分支 push                     -> debug artifact + signed release / debug fallback APK，并创建独立预发布 Release
# - pull_request                       -> 仅构建 debug APK（artifact）
# - push tag v*                        -> debug artifact + signed release / debug fallback APK，创建正式 GitHub Release
# - workflow_dispatch + build_release  -> debug artifact + signed release / debug fallback APK，并创建独立预发布 Release

name: Fork Build APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_release:
        description: '同时构建可安装 APK（有 keystore secrets 时为 release，否则为 debug fallback）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # 任何分支/PR 都跑：构建 debug APK 作为 artifact。
  # 不需要任何 secrets，fork 立即可用。
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17 (with gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # actions/setup-java 自带 gradle 缓存，零 post-cleanup 副作用。
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Print versions
        run: |
          ./gradlew --version
          java -version

      - name: Assemble debug APK
        run: ./gradlew :gpslogger:assembleDebug --no-daemon --stacktrace

      - name: Locate debug APK
        id: locate_debug
        run: |
          set -euxo pipefail
          APK_PATH=$(find gpslogger/build/outputs/apk/debug -maxdepth 2 -name "*.apk" -print -quit)
          test -n "$APK_PATH"
          BASENAME=$(basename "$APK_PATH")
          # 命名：gpslogger-travel-debug-<versionName>-<short_sha>.apk
          VERSION=$(grep -E "versionName\s+\"?[0-9A-Za-z._-]+\"?" gpslogger/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TARGET="gpslogger-travel-debug-${VERSION}-${SHORT_SHA}.apk"
          cp "$APK_PATH" "$TARGET"
          echo "apk_path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "apk_basename=$BASENAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpslogger-travel-debug-${{ steps.locate_debug.outputs.version }}-${{ github.run_number }}
          path: ${{ steps.locate_debug.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

  # 任意 push 都跑：分支 push 创建独立预发布 Release，tag push 创建正式 Release。
  # 与 build-debug 独立（不再 needs），避免 debug 任何步骤失败连带导致 release 不跑、Release 无 APK。
  # 没有签名 secrets 也能跑；此时发布 debug-signed APK，保证手机下载后可以安装。
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_release == 'true')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17 (with gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 仅在 fork 用户在 GitHub Secrets 里同时配了
      #   KEYSTORE_BASE64 / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD / SIGNING_STORE_PASSWORD
      # 时才解码 keystore；否则改走 debug fallback，避免产出 Android 拒绝安装的 unsigned APK。
      - name: Decode keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ] \
             && [ -n "${SIGNING_KEY_ALIAS:-}" ] \
             && [ -n "${SIGNING_KEY_PASSWORD:-}" ] \
             && [ -n "${SIGNING_STORE_PASSWORD:-}" ]; then
            mkdir -p gpslogger/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > gpslogger/keystore/your_signing_keystore.jks
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing or incomplete. Building installable debug fallback APK."
          fi

      # 关键点：只有在签名 secrets 完整时才把 SIGNING_* 注入子进程，
      # 否则 build.gradle 第 99 行会因 SIGNING_STORE_PASSWORD 非空进入「读 keystore 文件」分支但文件不存在。
      - name: Assemble release APK (signed)
        if: steps.keystore.outputs.have_keystore == 'true'
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew :gpslogger:assembleRelease --no-daemon --stacktrace

      - name: Assemble debug APK (installable fallback)
        if: steps.keystore.outputs.have_keystore != 'true'
        run: ./gradlew :gpslogger:assembleDebug --no-daemon --stacktrace

      - name: Locate packaged APK
        id: locate_release
        run: |
          set -euxo pipefail
          VERSION=$(grep -E "versionName\s+\"?[0-9A-Za-z._-]+\"?" gpslogger/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          # 区分发布模式：tag / push / manual。
          # 分支名可能包含 / 或空格，不能直接用于 tag 和 APK 文件名。
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            MODE="tag"
            LABEL="${GITHUB_REF##*/}"
            RELEASE_TAG="$LABEL"
            RELEASE_NAME="$LABEL"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            MODE="push"
            BRANCH="${GITHUB_REF#refs/heads/}"
            SAFE_BRANCH=$(printf '%s' "$BRANCH" | tr '/[:space:]' '--' | sed -E 's/[^0-9A-Za-z._-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' | cut -c1-48)
            if [ -z "$SAFE_BRANCH" ]; then SAFE_BRANCH="branch"; fi
            LABEL="push-${SAFE_BRANCH}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
            RELEASE_TAG="$LABEL"
            RELEASE_NAME="Push Build ${SAFE_BRANCH} ${SHORT_SHA}"
          else
            MODE="manual"
            LABEL="manual-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
            RELEASE_TAG="$LABEL"
            RELEASE_NAME="Manual Build ${SHORT_SHA}"
          fi
          if [ "${{ steps.keystore.outputs.have_keystore }}" = "true" ]; then
            APK_PATH=$(find gpslogger/build/outputs/apk/release -maxdepth 2 -name "*.apk" ! -name "*unsigned*" -print -quit)
            BUILD_KIND="release"
            SIGNING_STATUS="release-signed"
          else
            APK_PATH=$(find gpslogger/build/outputs/apk/debug -maxdepth 2 -name "*.apk" -print -quit)
            BUILD_KIND="debug"
            SIGNING_STATUS="debug-signed"
          fi
          test -n "$APK_PATH"
          TARGET="gpslogger-travel-${BUILD_KIND}-${VERSION}-${LABEL}.apk"
          cp "$APK_PATH" "$TARGET"
          ( cd "$(dirname "$TARGET")" && sha256sum "$(basename "$TARGET")" > "$(basename "$TARGET").SHA256" )
          echo "apk_path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "sha_path=$TARGET.SHA256" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_kind=$BUILD_KIND" >> "$GITHUB_OUTPUT"
          echo "signing_status=$SIGNING_STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload packaged APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpslogger-travel-${{ steps.locate_release.outputs.build_kind }}-${{ steps.locate_release.outputs.version }}-${{ steps.locate_release.outputs.label }}
          path: |
            ${{ steps.locate_release.outputs.apk_path }}
            ${{ steps.locate_release.outputs.sha_path }}
          if-no-files-found: error
          retention-days: 90

      # 分支 push / 手动构建使用每次唯一的 tag，确保每次 push 都对应一个独立 Release。
      # 这些 tag 不以 v 开头，不会走正式 tag 发版语义。
      - name: Create unique release tag
        if: steps.locate_release.outputs.mode != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.locate_release.outputs.tag }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/${{ steps.locate_release.outputs.tag }}"

      # 清理旧版 workflow 可能已经发布过的 unsigned APK，避免用户在 Release 页面误下无效包。
      - name: Remove old unsigned release assets
        if: steps.locate_release.outputs.mode == 'tag' || steps.locate_release.outputs.mode == 'push' || steps.locate_release.outputs.mode == 'manual'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.locate_release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || exit 0
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name | contains("-unsigned")) | .name' \
            | while IFS= read -r asset; do
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              done

      # rerun 同一个 workflow run 时 tag 不变，上传前移除旧 APK，避免同名 asset 冲突。
      - name: Remove old push/manual release APK assets
        if: steps.locate_release.outputs.mode == 'push' || steps.locate_release.outputs.mode == 'manual'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.locate_release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || exit 0
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name | startswith("gpslogger-travel-")) | .name' \
            | while IFS= read -r asset; do
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              done

      # 分支 push / manual 创建独立预发布 Release；tag 触发创建正式 Release。
      - name: Create GitHub Release
        if: steps.locate_release.outputs.mode == 'tag' || steps.locate_release.outputs.mode == 'push' || steps.locate_release.outputs.mode == 'manual'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.locate_release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.locate_release.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.locate_release.outputs.mode == 'push' || steps.locate_release.outputs.mode == 'manual' || contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          make_latest: ${{ steps.locate_release.outputs.mode == 'tag' && steps.locate_release.outputs.build_kind == 'release' }}
          fail_on_unmatched_files: true
          body: |
            自动构建产物。

            版本号（versionName）：`${{ steps.locate_release.outputs.version }}`
            构建来源：`${{ steps.locate_release.outputs.label }}`
            构建类型：`${{ steps.locate_release.outputs.build_kind }}`
            签名状态：`${{ steps.locate_release.outputs.signing_status }}`

            说明：
            - `release-signed`：使用仓库配置的 keystore 签名，可作为正式发布包。
            - `debug-signed`：缺少 keystore secrets 时的可安装测试包，不是正式发布包；若手机已安装不同签名的旧版本，需要先卸载旧版本再安装。

            校验：
            ```
            sha256sum -c *.SHA256
            ```
          files: |
            ${{ steps.locate_release.outputs.apk_path }}
            ${{ steps.locate_release.outputs.sha_path }}
